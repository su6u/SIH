name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: simulator/pyproject.toml
      - run: python -m pip install ./simulator[dev]
      - run: make test
      - run: python -m kinesis simulate simulator/scenarios/warehouse-12.json --max-ticks 180 --compact

  ros-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: simulation/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
