<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" role="img" aria-labelledby="title desc">
  <title id="title">Kinesis verification and validation evidence map</title>
  <desc id="desc">A compact V-model maps implemented coordination, peer protocol, and execution layers to repository tests, distributed process tests, ROS 2 Gazebo demonstrations, and remaining field validation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#223248" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F9364"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F06432"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; }
      .step { font-size: 12px; font-weight: 800; letter-spacing: 1.3px; }
      .title { font-size: 20px; font-weight: 800; fill: #223248; }
      .body { font-size: 12.5px; font-weight: 600; fill: #65758A; }
      .small { font-size: 12px; font-weight: 600; fill: #65758A; }
      .micro { font-size: 10px; font-weight: 700; letter-spacing: .5px; }
    </style>
  </defs>

  <!-- Section labels -->
  <g>
    <circle cx="86" cy="35" r="5" fill="#F06432"/>
    <text x="100" y="40" class="eyebrow" fill="#F06432">DESIGN + IMPLEMENTATION</text>
    <line x1="430" y1="35" x2="735" y2="35" stroke="#E4E9EF" stroke-width="2"/>
    <line x1="865" y1="35" x2="1268" y2="35" stroke="#E4E9EF" stroke-width="2"/>
    <circle cx="1284" cy="35" r="5" fill="#2F9364"/>
    <text x="1298" y="40" class="eyebrow" fill="#2F9364">VERIFICATION + VALIDATION</text>
  </g>

  <!-- V spine -->
  <path d="M 360 112 L 510 228 L 660 344 L 800 476" fill="none" stroke="#F06432" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 800 476 L 940 344 L 1090 228 L 1240 112" fill="none" stroke="#2F9364" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Evidence cross-links -->
  <path d="M 360 112 C 600 76, 1000 76, 1240 112" fill="none" stroke="#CDD6E0" stroke-width="1.6" stroke-dasharray="5 6"/>
  <path d="M 510 228 C 680 196, 920 196, 1090 228" fill="none" stroke="#CDD6E0" stroke-width="1.6" stroke-dasharray="5 6"/>
  <path d="M 660 344 C 730 322, 870 322, 940 344" fill="none" stroke="#CDD6E0" stroke-width="1.6" stroke-dasharray="5 6"/>

  <!-- Left 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="68" width="290" height="88" rx="14" fill="#FFFFFF" stroke="#F6C6B5" stroke-width="1.5"/>
  </g>
  <circle cx="360" cy="112" r="12" fill="#FFFFFF" stroke="#F06432" stroke-width="4"/>
  <text x="90" y="94" class="step" fill="#F06432">01 · COORDINATION INVARIANTS</text>
  <text x="90" y="119" class="title">Decision rules</text>
  <text x="90" y="138" class="body">complete bid view · timed occupancy</text>
  <text x="90" y="152" class="body">fresh peer authority</text>

  <!-- Left 2 -->
  <g filter="url(#shadow)">
    <rect x="220" y="184" width="290" height="88" rx="14" fill="#FFFFFF" stroke="#E7CDF0" stroke-width="1.5"/>
  </g>
  <circle cx="510" cy="228" r="12" fill="#FFFFFF" stroke="#A84CC6" stroke-width="4"/>
  <text x="240" y="210" class="step" fill="#A84CC6">02 · PEER PROTOCOL</text>
  <text x="240" y="235" class="title">Trust and membership</text>
  <text x="240" y="254" class="body">signed records · membership epochs</text>
  <text x="240" y="268" class="body">replay rejection</text>

  <!-- Left 3 -->
  <g filter="url(#shadow)">
    <rect x="370" y="300" width="290" height="88" rx="14" fill="#FFFFFF" stroke="#C9D5E2" stroke-width="1.5"/>
  </g>
  <circle cx="660" cy="344" r="12" fill="#FFFFFF" stroke="#40536B" stroke-width="4"/>
  <text x="390" y="326" class="step" fill="#40536B">03 · EXECUTION ADAPTER</text>
  <text x="390" y="351" class="title">Robot-local motion gate</text>
  <text x="390" y="370" class="body">ROS 2 / DDS · odometry freshness</text>
  <text x="390" y="384" class="body">local safety monitors</text>

  <!-- Centre integration node -->
  <g filter="url(#shadow)">
    <path d="M 530 434 H 1070 L 1106 476 L 1070 518 H 530 L 494 476 Z" fill="#223248"/>
  </g>
  <circle cx="800" cy="420" r="17" fill="#FFFFFF" stroke="#223248" stroke-width="3"/>
  <path d="M 792 420 L 798 426 L 810 411" fill="none" stroke="#2F9364" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="464" text-anchor="middle" class="step" fill="#A9B7C8">INTEGRATED RESEARCH PROTOTYPE</text>
  <text x="800" y="489" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">deterministic planner + independent peer runtimes</text>
  <text x="800" y="510" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#C8D2DE">same control boundary from simulation to robot adapter</text>

  <!-- Right 3 -->
  <g filter="url(#shadow)">
    <rect x="940" y="300" width="290" height="88" rx="14" fill="#FFFFFF" stroke="#C6E2D4" stroke-width="1.5"/>
  </g>
  <circle cx="940" cy="344" r="12" fill="#FFFFFF" stroke="#2F9364" stroke-width="4"/>
  <text x="960" y="326" class="step" fill="#2F9364">COMPONENT VERIFICATION</text>
  <text x="960" y="351" class="title">Repository test suite</text>
  <text x="960" y="370" class="body">planning · auctions · identity</text>
  <text x="960" y="384" class="body">recovery semantics</text>
  <g transform="translate(1168 314)">
    <rect width="44" height="23" rx="11.5" fill="#EAF6F0"/>
    <text x="22" y="16" text-anchor="middle" class="micro" fill="#2F9364">119/119</text>
  </g>

  <!-- Right 2 -->
  <g filter="url(#shadow)">
    <rect x="1090" y="184" width="290" height="88" rx="14" fill="#FFFFFF" stroke="#C6E2D4" stroke-width="1.5"/>
  </g>
  <circle cx="1090" cy="228" r="12" fill="#FFFFFF" stroke="#2F9364" stroke-width="4"/>
  <text x="1110" y="210" class="step" fill="#2F9364">DISTRIBUTED VERIFICATION</text>
  <text x="1110" y="235" class="title">Multi-process peers</text>
  <text x="1110" y="254" class="body">UDP exchange · liveness</text>
  <text x="1110" y="268" class="body">authority expiry</text>

  <!-- Right 1 -->
  <g filter="url(#shadow)">
    <rect x="1240" y="68" width="290" height="88" rx="14" fill="#FFFFFF" stroke="#C6E2D4" stroke-width="1.5"/>
  </g>
  <circle cx="1240" cy="112" r="12" fill="#FFFFFF" stroke="#2F9364" stroke-width="4"/>
  <text x="1260" y="94" class="step" fill="#2F9364">SYSTEM DEMONSTRATION</text>
  <text x="1260" y="119" class="title">ROS 2 + Gazebo path</text>
  <text x="1260" y="138" class="body">odometry · safety monitors</text>
  <text x="1260" y="152" class="body">zero-velocity stop</text>

  <!-- Pending field gate -->
  <path d="M 1480 155 C 1510 190, 1512 236, 1481 270" fill="none" stroke="#D48500" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <g>
    <rect x="1288" y="286" width="242" height="96" rx="14" fill="#FFF9EE" fill-opacity="0.92" stroke="#D48500" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="1307" y="310" class="step" fill="#B16E00">FIELD VALIDATION GATE</text>
    <text x="1307" y="335" class="small">target-device p95 latency</text>
    <text x="1307" y="353" class="small">packet loss + corridor-control trial</text>
    <text x="1307" y="375" class="micro" fill="#B16E00">PENDING PHYSICAL AMR EVIDENCE</text>
  </g>

  <!-- Failure-injection rail -->
  <text x="78" y="558" class="eyebrow" fill="#223248">FAIL-CLOSED CHECKS</text>
  <line x1="244" y1="553" x2="1518" y2="553" stroke="#E0E6EC" stroke-width="2"/>

  <g transform="translate(270 535)">
    <rect width="320" height="43" rx="21.5" fill="#FFFFFF" stroke="#F29A79" stroke-width="1.5"/>
    <circle cx="23" cy="21.5" r="7" fill="#F06432"/>
    <text x="42" y="18" class="micro" fill="#F06432">PARTIAL BID VIEW</text>
    <text x="42" y="33" class="small" fill="#223248">new task claim withheld</text>
  </g>
  <g transform="translate(640 535)">
    <rect width="320" height="43" rx="21.5" fill="#FFFFFF" stroke="#CFA9DC" stroke-width="1.5"/>
    <circle cx="23" cy="21.5" r="7" fill="#A84CC6"/>
    <text x="42" y="18" class="micro" fill="#A84CC6">STALE ODOMETRY / AUTHORITY</text>
    <text x="42" y="33" class="small" fill="#223248">executor publishes zero velocity</text>
  </g>
  <g transform="translate(1010 535)">
    <rect width="350" height="43" rx="21.5" fill="#FFFFFF" stroke="#A9CFBB" stroke-width="1.5"/>
    <circle cx="23" cy="21.5" r="7" fill="#2F9364"/>
    <text x="42" y="18" class="micro" fill="#2F9364">UNCERTAIN RESTART / OLD EPOCH</text>
    <text x="42" y="33" class="small" fill="#223248">motion remains fenced during recovery</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1390 545)">
    <line x1="0" y1="5" x2="34" y2="5" stroke="#2F9364" stroke-width="3"/>
    <text x="43" y="9" class="micro" fill="#65758A">VERIFIED</text>
    <line x1="0" y1="25" x2="34" y2="25" stroke="#D48500" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="43" y="29" class="micro" fill="#65758A">FIELD GATE</text>
  </g>
</svg>
