[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmroute-simulator"
version = "0.1.0"
description = "Deterministic algorithmic simulator for distributed warehouse AMR coordination"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SwarmRoute Research Team" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
swarmroute-sim = "swarmroute.cli:main"
swarmroute-peer = "swarmroute.peer_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
